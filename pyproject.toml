[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tg-agent-bridge"
version = "0.1.0"
description = "Local, human-approved bridge between Telegram and AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Igor Kropochev" }]
dependencies = [
  "PyYAML>=6.0.2",
  "Telethon>=1.40.0",
]

[project.scripts]
tgq = "tgbridge.cli.main:main"

[dependency-groups]
dev = [
  "basedpyright>=1.31.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.1.0",
  "pytest-socket>=0.7.0",
  "ruff>=0.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["tgbridge"]

[tool.pytest.ini_options]
addopts = "-ra --disable-socket --allow-unix-socket"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["tgbridge"]
exclude = ["tests"]
reportMissingTypeStubs = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
